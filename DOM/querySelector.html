<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div name="ElementName">Merhaba Javascript</div>
    <div id="ElementId">Benim Adim Erdem</div>
    <div class="ElementClass">Javascript Kodlamayi Öğreniyorum</div>
    <br>
    <div id="Element"></div>

    <script>
        let result = document.querySelector("div[class]").innerHTML;
        document.getElementById("Element").innerHTML = result;
    </script>
</body>

</html>
