<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>Merhaba Javascript</div>
    <div>Erdem Barut</div>

    <p>Bilgi:
        <br>
        <span id="Eleman"></span>
    </p>

    <script>
        let icerik = document.querySelectorAll("div");
        for (let value = 0; value < icerik.length; value++) {
            let result = icerik[value].innerHTML + "<br/>";

            document.getElementById("Eleman").innerHTML += result;
        };

    </script>
</body>

</html>
