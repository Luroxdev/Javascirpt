    <script>
        let kullanicilar = new Set(["Erdem", "Ali", "Mehmet"]);

            console.log(kullanicilar);

            kullanicilar.add(kullanici);
            console.log(kullanicilar);
            console.log("Eklendi");
        }


    </script>
