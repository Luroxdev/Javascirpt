<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="kutu">
        <p class="yazi">HTML</p>
        <p class="yazi">CSS</p>
        <p class="yazi">JavaScript</p>
    </div>

    <script>
        let icerik = document.querySelector(".yazi");
        icerik.textContent = "İlk Element";

        let yazilar = document.querySelectorAll(".yazi");

        for (let i = 0; i < yazilar.length; i++) {
            yazilar[i].textContent = "Değiştirildi"
        }
    </script>
</body>

</html>
