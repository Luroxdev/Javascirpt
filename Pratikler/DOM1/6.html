<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="buton">Tikla</button>
    <p id="sonuc"></p>
    <button id="kaldir">Event'i Kaldir</button>

    <script>
        function tikla() {
            document.getElementById("sonuc").innerHTML = "Butona basildi";
            document.removeEventListener("click", tikla);
        }

        document.addEventListener("click", tikla);

    </script>
</body>

</html>
