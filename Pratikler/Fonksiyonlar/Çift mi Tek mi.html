<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script type="text/javascript">
        function CiftMi(number) {
            let value;
            if (number % 2 == 0) {
                value = "Çift";
            } else {
                value = "Tek";
            }
            return value;
        }

        console.log(CiftMi(12));
        console.log(CiftMi(7));

    </script>
