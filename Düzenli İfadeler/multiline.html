<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: #1C1C28;
            color: #fff;
        }
    </style>

    <script type="text/javascript">
        let icerik = `Merhaba Javascript.
Erdem Barut.
Javascript Öğreniyorum.`;

        let desen = /^Erdem/m;
        let result = icerik.match(desen);
        let control = desen.multiline;

        document.write(result + "<br/>");
        document.write(control + "<br/>");

    </script>
</body>

</html>
