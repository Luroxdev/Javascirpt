<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: #1C1C28;
            color: #fff;
        }
    </style>

    <script type="text/javascript">
        let Icerik = "Merhaba Javascript. Ben Erdem Barut."
        let desen = /JAVASCRIPT/i;
        let result = Icerik.match(desen);
        let control = desen.ignoreCase;

        document.write(result + "<br/>");
        document.write(control + "<br/>");
    </script>
</body>

</html>
