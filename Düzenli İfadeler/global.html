<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: #1C1C28;
            color: #fff;
        }
    </style>

    <script type="text/javascript">
        let Icerik = "Merhaba Javascript. Ben Erdem Barut. Ben Javascript Öğreniyorum.";
        let Desen = /Javascript/;
        let result = Icerik.match(Desen);
        let control = Desen.global;

        document.write(result + "<br/>");
        document.write(control + "<br/>");
    </script>
</body>

</html>
