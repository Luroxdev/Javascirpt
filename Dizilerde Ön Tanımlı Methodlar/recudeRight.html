<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script typ="text/javascript">
        function Ornek(Contents, elementValue, indexValue, Reference) {
            return Contents - elementValue;
        }

        let numbers = [3, 5, 8, 10];
        document.write(numbers + "<br/>");
        let result = numbers.reduceRight(Ornek);
        document.write(result);
    </script>
</body>

</html>
