<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script type="text/javascript">
        function Ornek(value, index, reference) {
            return value > 50;
        }

        let numbers = [3, 5, 8, 10, 18, 24, 34, 48, 55, 71, 83, 100];
        document.write(numbers + "<br/>");
        let result = numbers.findIndex(Ornek);
        document.write(result);
    </script>
</body>

</html>
