<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script type="text/javascript">
        function Ornek(elementValue, indexValue, reference) {
            let result = elementValue * 100;
            return result;
        }

        let numbers = [3, 5, 8];
        document.write(numbers + "<br/>");
        let contents = numbers.map(Ornek);
        document.write(contents);
    </script>
</body>

</html>
