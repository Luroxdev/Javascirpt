<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: #1C1C28;
            color: #fff;
        }
    </style>

    <script>
        class Ornek {
            constructor(DTarihiValue) {
                this.Ad = "Erdem";
                this.Soyad = "Barut";
                this.DTarihi = DTarihiValue;
            }

            Yas() {
                let zaman = new Date();
                let result = zaman.getFullYear() - this.DTarihi;
                return result;
            }
        }

        let kisi = new Ornek(2009);
        let icerik = `${kisi.Ad} ${kisi.Soyad} ${kisi.DTarihi} ${kisi.Yas()} Yaşinda.`;
        console.log(icerik);
    </script>
</body>

</html>
