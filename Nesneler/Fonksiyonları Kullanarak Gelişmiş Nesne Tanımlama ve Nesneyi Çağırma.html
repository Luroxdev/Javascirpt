        let Ornek = function (DTarihiValue, UlkeValue = "Türkiye") {
            this.Ad = "Erdem";
            this.Soyad = "Barut";
            this.DTarihi = DTarihiValue;
            this.Ulke = UlkeValue;

            this.Bilgiler = function () {
                let icerik = `${this.Ad} ${this.Soyad} ${this.DTarihi} ${this.Ulke}`;

            }
