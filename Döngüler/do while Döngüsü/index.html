<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script type="text/javascript">
        let value = 1;

        do {
            document.write(value + "<br/>");
            value++;
        }
        while (value <= 10);
    </script>
</body>

</html>
