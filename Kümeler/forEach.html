<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: #1C1C28;
            color: #FFF;
        }
    </style>

    <script>
        function Ornek(Value, Anahtar, Referans) {

            result += `${Value} ${Anahtar} ${Referans} <br/>`;
        }

        let Diller = new Set(["Javascript", "React", "Node.js", "Tailwind"]);
        let result = "";
        Diller.forEach(Ornek);
        document.write(result);
    </script>
</body>
