<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightskyblue;
        }
    </style>

    <script type="text/javascript">
        function Ornek(price, taxRate = 20) {
            let bill = price + ((price / 100) * taxRate);
            let Icerik = "Toplam tutar: " + bill + "<br/>";

            return Icerik;
        }
        document.write(Ornek(200));
    </script>
</body>

</html>
