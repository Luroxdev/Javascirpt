<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script type="text/javascript">
        function Faktöryel(n) {
            let result = 1;

            if (n <= 0) {
                document.write("Negatif sayi giriniz.");
                return;
            } else {
                for (let i = 2; i <= n; i++) {
                    result *= i;
                }
                return result;
            }
        }
        document.write(Faktöryel(5));
    </script>
</body>

</html>
