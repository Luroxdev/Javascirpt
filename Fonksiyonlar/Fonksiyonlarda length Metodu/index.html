<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script type="text/javascript">
        function Ornek(A, B, C, D) {
            let value = `${A} ${B} ${C} ${D}`;
            document.write(value + "<br/>");
            let ParametreSayisi = Ornek.length;
            document.write(ParametreSayisi);
        }
        Ornek("Benim", "Adim", "Erdem", "Barut");
        document.write(value + "<br/>");
    </script>
</body>

</html>
