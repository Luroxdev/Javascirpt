<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: lightblue;
        }
    </style>

    <script type="text/javascript">
        function Kisi(Isim, Soyad) {
            let metin = Isim + " " + Soyad;
            return {
                result: function (Lang) {
                    let Icerik = Lang + "Eğitim Seti" + "<br/>" + metin;
                    return Icerik;
                }
            }
        }
        let value = Kisi("Erdem", "Barut").result("Javascript ");
        document.write(value);
    </script>
</body>

</html>
